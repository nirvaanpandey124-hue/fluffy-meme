<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Shooter</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at top, #1a2233 0%, #090b12 55%, #020305 100%);
            color: #fff;
            font-family: 'Inter', system-ui, sans-serif;
            touch-action: none;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, rgba(248, 248, 255, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.35;
            pointer-events: none;
        }

        #game-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(93, 220, 255, 0.08), transparent 38%),
                        radial-gradient(circle at bottom left, rgba(106, 96, 255, 0.06), transparent 25%);
            pointer-events: none;
        }

        #menu-screen {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background: rgba(2, 3, 5, 0.78);
            backdrop-filter: blur(12px);
        }

        .menu-card {
            width: min(420px, 100%);
            padding: 28px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: linear-gradient(180deg, rgba(20, 28, 46, 0.96), rgba(10, 14, 24, 0.95));
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
            text-align: center;
        }

        .menu-card h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 4vw, 42px);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .menu-card p {
            margin: 0 0 20px;
            color: rgba(235, 249, 255, 0.8);
            line-height: 1.6;
        }

        .menu-button {
            border: 0;
            border-radius: 999px;
            padding: 13px 24px;
            font-weight: 700;
            font-size: 16px;
            color: #07111f;
            background: linear-gradient(90deg, #5ddcff, #6d8dff);
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(93, 220, 255, 0.18);
        }

        #game-ui {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #game-ui .status-panel,
        #game-ui .control-button {
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }

        #gameCanvas {
            background: radial-gradient(circle at 30% 20%, rgba(52, 126, 239, 0.16), rgba(0, 0, 0, 0.95));
            border: 2px solid rgba(255, 255, 255, 0.14);
            border-radius: 24px;
            box-shadow: 0 24px 72px rgba(0, 0, 0, 0.55);
            display: block;
            touch-action: none;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }

        .control-button {
            position: absolute;
            width: 90px;
            height: 90px;
            min-width: 90px;
            min-height: 90px;
            border: 1px solid rgba(93, 220, 255, 0.22);
            border-radius: 24px;
            background: linear-gradient(180deg, rgba(20, 28, 46, 0.94), rgba(15, 20, 32, 0.85));
            color: #f7f9ff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(18px);
            cursor: pointer;
            transition: background 140ms ease, transform 140ms ease, box-shadow 140ms ease;
            pointer-events: auto;
            touch-action: none;
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.28);
        }

        .control-button:hover {
            background: linear-gradient(180deg, rgba(46, 65, 110, 0.95), rgba(18, 24, 42, 0.95));
        }

        .control-button:active,
        .control-button.active {
            background: linear-gradient(180deg, rgba(67, 107, 229, 0.9), rgba(43, 78, 195, 0.9));
            transform: translateY(2px) scale(0.96);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
        }

        .control-button.active {
            background: rgba(77, 109, 221, 0.28);
            transform: translateY(1px) scale(0.95);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
        }

        .control-button:focus {
            outline: none;
        }

        #control-left {
            bottom: 20px;
            left: 20px;
        }

        #control-right {
            bottom: 20px;
            left: 132px;
        }

        #control-fire {
            bottom: 20px;
            right: 20px;
            width: 100px;
            height: 100px;
            font-size: 15px;
        }

        #pause-button {
            top: 20px;
            right: 20px;
            width: 76px;
            height: 76px;
            font-size: 14px;
        }

        #reset-button {
            top: 20px;
            right: 110px;
            width: 76px;
            height: 76px;
            font-size: 14px;
        }

        #exit-button {
            top: 20px;
            right: 200px;
            width: 76px;
            height: 76px;
            font-size: 14px;
        }

        .status-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 14px 18px;
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(18, 24, 42, 0.92), rgba(12, 16, 28, 0.82));
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #dbe9ff;
            font-size: 14px;
            line-height: 1.4;
            backdrop-filter: blur(16px);
            max-width: calc(100vw - 180px);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.22);
        }

        .status-panel .title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: #e5f2ff;
        }

        .status-panel .subtitle {
            color: rgba(235, 249, 255, 0.75);
        }

        .status-panel .stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(80px, 1fr));
            gap: 6px 16px;
            margin-top: 10px;
        }

        .status-panel .stat {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 10px 12px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .status-panel .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }

        .status-panel .level-meter {
            position: relative;
            height: 10px;
            width: 100%;
            margin-top: 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .status-panel .level-meter .meter-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #5ddcff, #4f7cff 95%);
            border-radius: 999px;
            transition: width 140ms ease;
        }

        .status-panel .next-level {
            margin-top: 10px;
            font-size: 12px;
            color: rgba(235, 249, 255, 0.72);
            letter-spacing: 0.04em;
        }

        @media (min-width: 720px) {
            .control-button {
                width: 110px;
                height: 110px;
                font-size: 18px;
            }

            #control-right {
                left: 156px;
            }

            #control-fire {
                width: 118px;
                height: 118px;
            }

            #pause-button {
                width: 84px;
                height: 84px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="menu-screen">
            <div class="menu-card">
                <h1>Mini Shooter</h1>
                <p>Blast through 15 retro space levels and survive the neon storm.</p>
                <button id="play-button" class="menu-button">Play Game</button>
            </div>
        </div>
        <canvas id="gameCanvas" width="600" height="600" aria-label="Mini Shooter game"></canvas>
        <div id="game-ui" class="hidden">
            <div class="status-panel">
                <div class="title">Mini Shooter</div>
                <div class="subtitle">LEFT/RIGHT to move • FIRE to shoot • MUSIC starts on first tap</div>
                <div class="stats">
                    <div class="stat">
                        <span class="stat-label">Score</span>
                        <span id="score-value" class="stat-value">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Level</span>
                        <span id="level-value" class="stat-value">1 / 15</span>
                    </div>
                </div>
                <div class="level-meter" aria-label="Progress to next level">
                    <div id="level-progress" class="meter-fill"></div>
                </div>
                <div id="next-level-value" class="next-level">Next level in 4 points</div>
            </div>
            <button id="exit-button" class="control-button">Exit</button>
            <button id="reset-button" class="control-button">Reset</button>
            <button id="pause-button" class="control-button">Pause</button>
            <button id="control-left" class="control-button">◀</button>
            <button id="control-right" class="control-button">▶</button>
            <button id="control-fire" class="control-button">FIRE</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
